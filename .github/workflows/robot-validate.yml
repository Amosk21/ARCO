name: ROBOT Validation

# Independent DL validation using ROBOT (v1.9.10) and HermiT.
# Runs alongside the production owlrl pipeline as a cross-check, not a replacement.
#
# Phase 0: confirm ROBOT installs and runs in CI.
# Phase 1: merge ARCO ontology files and run robot validate-profile --profile DL.
#           Confirms the ontology is OWL 2 DL conformant.
#           Gates CI: profile violations fail the build.
# Phase 2: run robot reason --reasoner HermiT with full ABox materialization.
#           Flags: --axiom-generators "ClassAssertion SubClass" --include-indirect true
#           Required so HermiT propagates individual classifications through the
#           inferred SubClass chain. Without --include-indirect true, ClassAssertion
#           only materializes direct equivalentClass hits and misses transitive steps.
#           Gates CI: HermiT crashes or DL inconsistency fail the build.
# Phase 3: run ARCO's SPARQL classification queries against the HermiT-reasoned graph
#           and compare to the owlrl baseline. Confirms both reasoners agree.
#           Disagreement would indicate RL incompleteness or unexpected DL entailments.
#           Gates CI: any classification mismatch fails the build.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  robot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ROBOT_VERSION: v1.9.10
      ROBOT_JAR_URL: https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache ROBOT JAR
        id: cache-robot
        uses: actions/cache@v4
        with:
          path: ~/.local/share/robot/robot.jar
          key: robot-${{ env.ROBOT_VERSION }}

      - name: Download ROBOT
        if: steps.cache-robot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/robot
          curl -L -o ~/.local/share/robot/robot.jar "$ROBOT_JAR_URL"

      - name: Verify ROBOT version
        shell: bash
        run: |
          set -euo pipefail
          java -jar ~/.local/share/robot/robot.jar --version
          echo "ROBOT smoke test PASSED."

      # Phase 1: OWL 2 DL profile validation
      # Merges the same files the Python pipeline loads, then runs validate-profile.
      # Gates CI: the step exits non-zero on profile violations.
      # The profile report is printed to logs and uploaded as an artifact for review.
      - name: Merge ARCO ontology files
        shell: bash
        run: |
          set -euo pipefail
          ROBOT="java -jar $HOME/.local/share/robot/robot.jar"
          $ROBOT merge \
            --input "03_TECHNICAL_CORE/ontology/imports/bfo-2020.owl" \
            --input "03_TECHNICAL_CORE/ontology/imports/iao_bot.owl" \
            --input "03_TECHNICAL_CORE/ontology/imports/ro_bot.owl" \
            --input "03_TECHNICAL_CORE/ontology/imports/cco_bot.owl" \
            --input "03_TECHNICAL_CORE/ontology/ARCO_core.ttl" \
            --input "03_TECHNICAL_CORE/ontology/ARCO_governance_extension.ttl" \
            --input "03_TECHNICAL_CORE/ontology/ARCO_instances_sentinel.ttl" \
            --output /tmp/arco_merged.owl
          echo "Merge complete: /tmp/arco_merged.owl"

      - name: Validate OWL 2 DL profile
        shell: bash
        run: |
          ROBOT="java -jar $HOME/.local/share/robot/robot.jar"
          mkdir -p /tmp/robot-reports

          # Capture exit code so we can print the report whether or not it succeeds
          set +e
          $ROBOT validate-profile \
            --profile DL \
            --input /tmp/arco_merged.owl \
            --output /tmp/robot-reports/dl_profile_report.txt \
            2>&1
          PROFILE_EXIT=$?
          set -e

          echo "=== OWL 2 DL Profile Report ==="
          cat /tmp/robot-reports/dl_profile_report.txt || echo "(no report file generated)"
          echo "=== Profile validation exit code: ${PROFILE_EXIT} ==="

          if [ "${PROFILE_EXIT}" -eq 0 ]; then
            echo "RESULT: ARCO is OWL 2 DL conformant."
          else
            echo "FAIL: ARCO has OWL 2 DL profile violations. See report above."
            exit 1
          fi

      - name: Upload profile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl2-dl-profile-report
          path: /tmp/robot-reports/
          if-no-files-found: warn

      # Phase 2: HermiT DL reasoning
      # Runs HermiT on the same merged ontology used in Phase 1.
      # Confirms ontology is DL-consistent and reasoner terminates without error.
      # Gates CI: HermiT crash or DL inconsistency fails the build.
      # Reasoned graph uploaded as artifact for later comparison vs owlrl output.
      - name: Reason with HermiT
        shell: bash
        run: |
          ROBOT="java -jar $HOME/.local/share/robot/robot.jar"
          mkdir -p /tmp/robot-reports

          # --axiom-generators "ClassAssertion SubClass": materialize both individual
          # type assertions and class subsumptions. ClassAssertion alone only fires
          # on direct equivalentClass hits; SubClass is needed for the TBox side.
          # --include-indirect true: propagate ClassAssertions through the inferred
          # SubClass chain. Without this, Sentinel_ID_System : HighRiskSystem is
          # not emitted even though AnnexIII1aApplicableSystem subClassOf HighRiskSystem
          # is inferred and Sentinel : AnnexIII1aApplicableSystem is direct.
          # Capture the exit code via PIPESTATUS so we keep the tee'd log AND can fail.
          set +e
          $ROBOT reason \
            --reasoner hermit \
            --axiom-generators "ClassAssertion SubClass" \
            --include-indirect true \
            --input /tmp/arco_merged.owl \
            --output /tmp/robot-reports/arco_reasoned.owl \
            2>&1 | tee /tmp/robot-reports/hermit_log.txt
          REASON_EXIT=${PIPESTATUS[0]}
          set -e

          echo "=== HermiT reasoning exit code: ${REASON_EXIT} ==="

          if [ "${REASON_EXIT}" -eq 0 ]; then
            echo "RESULT: ARCO is consistent under HermiT. Reasoned graph produced."
            ls -la /tmp/robot-reports/arco_reasoned.owl
          else
            echo "FAIL: HermiT reported a problem. See log above."
            exit 1
          fi

      - name: Upload HermiT reasoned graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermit-reasoned-graph
          path: |
            /tmp/robot-reports/arco_reasoned.owl
            /tmp/robot-reports/hermit_log.txt
          if-no-files-found: warn

      # Phase 3: classification diff -- HermiT vs owlrl
      # Loads the HermiT-reasoned graph and runs ARCO's SPARQL ASK classification
      # queries against it, then compares results to the expected owlrl baseline.
      # Both reasoners should produce identical classifications for the Sentinel-ID
      # system (which is the system under evaluation in the default pipeline run).
      # Gates CI: any classification mismatch between HermiT and the owlrl baseline
      # fails the build.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --quiet rdflib owlrl==7.1.4

      # Phase 3: HermiT vs OWL-RL agreement on certificate-grade fixtures.
      # Extends the Sentinel-only diff to all certificate-grade scenarios:
      # Sentinel, CreditScorer, VerificationKiosk, DecoySystem, and both flag
      # tests. GhostSystem (ARCO_instances_adversarial_blanknode.ttl) is
      # intentionally excluded — its disposition is an anonymous individual
      # (blank node), and HermiT does not emit ClassAssertion axioms for
      # anonymous individuals (DL profile behavior, not a defect). The audit-
      # side detect_latent_risk traversal therefore returns False under HermiT
      # and True under OWL-RL on GhostSystem. GhostSystem is a reasoner-property
      # probe, not production modeling guidance. The decision to require named
      # evidence-bearing particulars in production data is queued for a human
      # modeling session — see:
      #   runs/loop/2026-05-09_beverley-research/design_memo_named-evidence-bearing-particulars.md
      #   runs/loop/2026-05-09_beverley-research/modeling_decisions_queue.md (Q1)
      # Script logic and exclusion rules: 03_TECHNICAL_CORE/scripts/hermit_cross_check.py
      - name: HermiT vs OWL-RL agreement (certificate-grade fixtures)
        shell: bash
        run: |
          set -euo pipefail
          export ROBOT_JAR="$HOME/.local/share/robot/robot.jar"
          python 03_TECHNICAL_CORE/scripts/hermit_cross_check.py
